name: Trucks Venture Fund I
description: >-
  Trucks Venture Capital (Trucks VC) is an early-stage venture firm headquartered
  in San Francisco investing in companies building the future of transportation —
  making mobility decarbonized, safer, and more accessible. Its focus spans
  autonomous vehicles, electric aviation, agricultural robotics, fleet management,
  and mobility infrastructure. Trucks Venture Fund I is the firm's first fund;
  notable portfolio outcomes include Joby Aviation (NYSE: JOBY), Bear Flag Robotics
  (acquired by John Deere), nuTonomy (acquired by Delphi), Roadster (acquired by
  CDK Global), and Zendrive (acquired by Intuit). Surfaced as a portfolio relation
  of 500 Global and profiled in the API Evangelist network as a venture-capital
  firm; it publishes a marketing/portfolio website but no developer API surface.
